name: "Release App"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install

      - name: Obtener historial de commits (Changelog)
        id: commit_logs
        shell: pwsh
        run: |
          $PREV_TAG = (git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>$null)
          
          if (-not $PREV_TAG) {
            $PREV_TAG = (git rev-list --max-parents=0 HEAD)
          }

          $CHANGELOG = (git log "$PREV_TAG..HEAD" --oneline --no-merges --pretty=format:"• %s")

          if (-not $CHANGELOG) {
            $CHANGELOG = "• Mejoras y correcciones menores en la aplicación."
          }

          "CHANGELOG<<EOF" >> $env:GITHUB_OUTPUT
          $CHANGELOG >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT

      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Remote Mic ${{ github.ref_name }}"
          releaseBody: |
            Novedades en ${{ github.ref_name }}:
            ${{ steps.commit_logs.outputs.CHANGELOG }}
          generateReleaseNotes: false
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}